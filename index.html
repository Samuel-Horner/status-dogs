<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./style.css">
    <title>Status Dogs</title>
</head>

<body>
    <main>
        <div class="container">
            <img id="dog-img" src=''></img>
            <input id="status-input" type="number" value="200" oninput="onInput()"></input>
            <p id="message-display">Unassigned</p>
        </div>
    </main>
    <script src='./index.js'></script>
    <script>
        const input = document.getElementById('status-input');
        const img = document.getElementById('dog-img');
        const message_display = document.getElementById('message-display');

        function onInput() {
            const val = parseInt(input.value);
            if (val >= 100 && val <= 511) {
                message_display.innerText = getStatusMessage(val);
                getImage().then(url => {
                    img.src = url;
                });
            }
        }

        onInput();
    </script>
</body>

</html>
